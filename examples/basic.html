<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Loop Ad Event SDK Example</title>
    </head>
    <body>
        <button
            data-loopad-event="product_selected"
            data-loopad-id="primary-product"
            data-loopad-properties='{"product_id":"sku-1","position":1,"featured":true,"labels":["new"]}'
        >
            Select
        </button>

        <script src="../dist/loop-ad-event-sdk.iife.js"></script>
        <script>
            void (async () => {
                const sdk = await LoopAdEventSDK.init({
                    connectionUrl:
                        "https://dashboard.api.dev.loop-ad.org/api/public/v1/sdk/connections/public_sdk_key",
                    identity: {
                        userId: "example-user",
                        sessionId: "example-session"
                    },
                    debug: true
                });

                sdk.track("checkout_completed", {
                    order_id: "order-1",
                    amount: 129000,
                    quantity: 2,
                    refundable: true,
                    tags: ["example"],
                    item: {
                        sku: "sku-1",
                        count: 2
                    }
                });
            })();
        </script>
    </body>
</html>
